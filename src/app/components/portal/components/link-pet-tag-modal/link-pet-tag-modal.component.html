@if (show) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="close.emit()"></div>
    <div class="bg-white rounded-2xl w-full max-w-md p-6 relative z-10 shadow-2xl animate-fade-in-up">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-lg">
            <i class="fa-solid fa-link"></i>
          </div>
          <h3 class="text-xl font-bold text-slate-800">Link Tag to Pet</h3>
        </div>
        <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 transition-colors w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form (submit)="$event.preventDefault(); submit.emit()">
        <div class="space-y-4">
          <div class="relative">
            <label class="block text-sm font-medium text-slate-700 mb-1">Pet Tag Serial Number *</label>
            <input type="text" placeholder="e.g. TT3XK" 
                   [ngModel]="linkSerial" (ngModelChange)="linkSerialChange.emit($event)" 
                   (focus)="showDropdown = true" (blur)="showDropdown = false"
                   name="serial" autocomplete="off" required
                   class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-slate-800 font-mono">
            @if (showDropdown && filteredTags.length > 0) {
              <div class="absolute z-10 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">
                @for (tag of filteredTags; track tag.tagId) {
                  <div class="px-4 py-2 hover:bg-slate-50 cursor-pointer text-slate-700 flex justify-between items-center" (mousedown)="$event.preventDefault(); selectTag(tag.tagId)">
                    <span class="font-mono font-bold">{{ tag.tagId }}</span>
                    <span class="text-xs text-orange-600 font-semibold">{{ tag.tagType === 'Pet' ? 'Available Pet Tag' : (tag.tagType === 'Home' ? 'Available Home Tag' : 'Available Tag') }}</span>
                  </div>
                }
              </div>
            }
          </div>
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Select Pet *</label>
            <select [ngModel]="linkPetId" (ngModelChange)="linkPetIdChange.emit($event)" name="pet" required
                    class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-slate-800">
              <option value="">-- Choose registered pet --</option>
              @for (p of pets; track p.id) {
                <option [value]="p.id">{{ p.name }} ({{ p.species }})</option>
              }
            </select>
          </div>
        </div>

        <div class="mt-8 flex gap-3">
          <button type="button" class="flex-1 px-4 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-colors" (click)="close.emit()" [disabled]="isLinkingTag">Cancel</button>
          <button type="submit" class="flex-1 px-4 py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition-colors shadow-lg shadow-orange-500/30 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center" [disabled]="isLinkingTag || !linkSerial || !linkPetId">
            <i *ngIf="isLinkingTag" class="fa-solid fa-circle-notch fa-spin mr-2"></i>
            {{ isLinkingTag ? 'Linking...' : 'Link Tag' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
