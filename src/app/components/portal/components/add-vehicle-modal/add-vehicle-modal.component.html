@if (show) {
  <div class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Register New Vehicle</h2>
        <button class="modal-close" (click)="close.emit()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <form (submit)="$event.preventDefault(); submit.emit()">
          <div class="form-grid-2">
            <div class="form-group" style="position: relative;">
              <label for="veh-make">Make / Manufacturer *</label>
              <input id="veh-make" type="text" placeholder="Search Make..." 
                     [ngModel]="makeSearchQuery" (ngModelChange)="makeSearchQuery = $event"
                     (focus)="showMakeDropdown = true" (blur)="showMakeDropdown = false"
                     name="make" autocomplete="off" required>
              @if (showMakeDropdown) {
                <div class="custom-dropdown">
                  @for (make of filteredMakes; track make.id) {
                    <div class="dropdown-item" (mousedown)="$event.preventDefault(); selectMake(make.id, make.name)">
                      {{ make.name }}
                    </div>
                  }
                </div>
              }
            </div>
            <div class="form-group" style="position: relative;">
              <label for="veh-model">Model *</label>
              <input id="veh-model" type="text" placeholder="Search Model..." 
                     [ngModel]="modelSearchQuery" (ngModelChange)="modelSearchQuery = $event"
                     (focus)="showModelDropdown = true" (blur)="showModelDropdown = false"
                     name="model" autocomplete="off" required [disabled]="!selectedMakeId">
              @if (showModelDropdown && selectedMakeId) {
                <div class="custom-dropdown">
                  @if (models.length === 0) {
                    <div class="dropdown-item" style="color: #64748b; font-style: italic;">No models loaded</div>
                  }
                  @for (model of filteredModels; track model.id) {
                    <div class="dropdown-item" (mousedown)="$event.preventDefault(); selectModel(model.id, model.name)">
                      {{ model.name }}
                    </div>
                  }
                </div>
              }
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label for="veh-year">Model Year</label>
              <input id="veh-year" type="number" placeholder="2025" [ngModel]="newYear" (ngModelChange)="newYearChange.emit($event)" name="year">
            </div>
            <div class="form-group">
              <label for="veh-color">Exterior Color</label>
              <input id="veh-color" type="text" placeholder="e.g. Solid Black" [ngModel]="newColor" (ngModelChange)="newColorChange.emit($event)" name="color">
            </div>
          </div>
          <!-- Hidden fields removed from UI as per requirements -->

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="close.emit()" [disabled]="isLoading">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="isLoading">
              <i *ngIf="isLoading" class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i>
              {{ isLoading ? 'Adding...' : 'Add Vehicle' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
