<div *ngIf="show" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="close.emit()"></div>
  <div class="bg-white rounded-2xl w-full max-w-md p-6 relative z-10 shadow-2xl animate-fade-in-up">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-paw"></i>
        </div>
        <h3 class="text-xl font-bold text-slate-800">Register Pet</h3>
      </div>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 transition-colors w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form (ngSubmit)="submitPet.emit()">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Pet Name <span class="text-red-500">*</span></label>
          <input type="text" 
                 [ngModel]="newName" 
                 (ngModelChange)="newNameChange.emit($event)" 
                 name="newName"
                 placeholder="e.g. Max, Bella, Charlie"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-slate-800"
                 required>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Pet Type / Species <span class="text-red-500">*</span></label>
          <select [ngModel]="newSpecies"
                  (ngModelChange)="newSpeciesChange.emit($event)"
                  name="newSpecies"
                  class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-slate-800"
                  required>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Bird">Bird / Parrot</option>
            <option value="Rabbit">Rabbit</option>
            <option value="Other">Other Pet</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Breed (Optional)</label>
          <input type="text" 
                 [ngModel]="newBreed" 
                 (ngModelChange)="newBreedChange.emit($event)" 
                 name="newBreed"
                 placeholder="e.g. Golden Retriever, Persian Cat"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-slate-800">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Notes / Microchip / Color (Optional)</label>
          <input type="text" 
                 [ngModel]="newNotes" 
                 (ngModelChange)="newNotesChange.emit($event)" 
                 name="newNotes"
                 placeholder="e.g. Red collar, Friendly, Needs medication"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-slate-800">
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button type="button" (click)="close.emit()" class="flex-1 px-4 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="isRegistering || !newName" class="flex-1 px-4 py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600 transition-colors shadow-lg shadow-orange-500/30 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
          <i *ngIf="isRegistering" class="fa-solid fa-circle-notch fa-spin mr-2"></i>
          {{ isRegistering ? 'Saving...' : 'Register Pet' }}
        </button>
      </div>
    </form>
  </div>
</div>
