<div *ngIf="show" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" (click)="close.emit()"></div>
  <div class="bg-white rounded-2xl w-full max-w-md p-6 relative z-10 shadow-2xl animate-fade-in-up">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-bold text-slate-800">Add New Home</h3>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 transition-colors w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form (submit)="submit.emit(); $event.preventDefault()">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Home Name <span class="text-red-500">*</span></label>
          <input type="text" 
                 [ngModel]="newName" 
                 (ngModelChange)="newNameChange.emit($event)" 
                 name="newName"
                 placeholder="e.g. My Beach House, Main Residence"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-slate-800"
                 required>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Address <span class="text-red-500">*</span></label>
          <input type="text" 
                 [ngModel]="newAddress" 
                 (ngModelChange)="newAddressChange.emit($event)" 
                 name="newAddress"
                 placeholder="e.g. 123 Main St, Apt 4"
                 class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-slate-800"
                 required>
        </div>
      </div>

      <div class="mt-8 flex gap-3">
        <button type="button" (click)="close.emit()" class="flex-1 px-4 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl font-bold hover:bg-slate-50 transition-colors">
          Cancel
        </button>
        <button type="submit" [disabled]="isRegistering || !newName || !newAddress" class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center">
          <i *ngIf="isRegistering" class="fa-solid fa-circle-notch fa-spin mr-2"></i>
          {{ isRegistering ? 'Saving...' : 'Add Home' }}
        </button>
      </div>
    </form>
  </div>
</div>
