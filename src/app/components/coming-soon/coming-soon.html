<div class="page-container">
  <app-navbar></app-navbar>

  <div class="coming-soon-hero" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
    <div class="hero-content">
      <span class="badge" style="background: rgba(255,184,0,0.15); color: #FFB800; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; margin-bottom: 20px; display: inline-block;">
        <i class="fa-solid fa-person-digging"></i> Under Construction
      </span>
      <h1 style="font-size: 3.5rem; font-weight: 800; color: #fff; margin-bottom: 20px;">Coming Soon</h1>
      <p style="font-size: 1.2rem; color: #cbd5e1; max-width: 600px; margin: 0 auto 40px; line-height: 1.6;">
        We're working hard to bring this page to life. Stay tuned for exciting new updates!
      </p>
      
      <a [routerLink]="['/']" class="btn btn-primary" style="padding: 14px 32px; font-size: 1.1rem; border-radius: 30px; display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #FFB800 0%, #F59E0B 100%); color: #1e293b; font-weight: 700; text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> Return to Home
      </a>
    </div>
  </div>

  <app-footer></app-footer>
</div>
