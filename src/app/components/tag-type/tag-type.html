<app-navbar></app-navbar>

<main class="tag-page-container">
  <!-- Banner Section -->
  <section class="tag-banner" *ngIf="tagData" [style.backgroundImage]="'url(' + tagData.bannerImage + ')'">
    <div class="banner-overlay"></div>
    <div class="banner-content">
      <h1 class="text-4xl md:text-6xl font-bold text-white mb-4">{{ tagData.title }}</h1>
      <p class="text-xl text-white/90 mb-8 max-w-2xl">{{ tagData.subtitle }}</p>
      <a routerLink="/register" class="cta-button primary-btn">Get Your Tag Now</a>
    </div>
  </section>

  <!-- Details Section -->
  <section class="tag-details-section py-16 px-4 md:px-8 max-w-7xl mx-auto" *ngIf="tagData">
    <div class="grid md:grid-cols-2 gap-12 items-center">
      <div class="tag-text">
        <h2 class="text-3xl font-bold mb-6">Why Choose the {{ tagData.title }}?</h2>
        <p class="text-lg text-gray-700 mb-6 leading-relaxed">
          {{ tagData.description }}
        </p>
        <a routerLink="/pricing" class="cta-button secondary-btn inline-block">View Pricing Plans</a>
      </div>
      
      <div class="tag-features bg-gray-50 p-8 rounded-2xl shadow-sm border border-gray-100">
        <h3 class="text-2xl font-semibold mb-6">Key Benefits</h3>
        <ul class="feature-list space-y-4">
          <li *ngFor="let feature of tagData.features" class="flex items-start">
            <i class="fa-solid fa-circle-check text-green-500 mt-1 mr-3 text-lg"></i>
            <span class="text-gray-800 text-lg">{{ feature }}</span>
          </li>
        </ul>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
