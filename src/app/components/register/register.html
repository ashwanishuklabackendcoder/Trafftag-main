<div class="auth-container">
  <!-- Background Glows -->
  <div class="bg-glow-gold" style="top: -10%; left: -10%;"></div>
  <div class="bg-glow-gold" style="bottom: -10%; right: -10%;"></div>

  <header class="auth-header">
    <div class="logo" [routerLink]="['/']">
      <span class="logo-icon"><i class="fa-solid fa-taxi"></i></span>
      <span class="logo-text">TRAFF<span class="logo-highlight">TAG</span></span>
    </div>
    <a [routerLink]="['/']" class="back-home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </header>

  <main class="auth-card-wrapper">
    <div class="glass-card auth-card animate-fade-in-up">
      <div class="form-header animate-fade-in-up delay-100">
        <h2>Create TRAFFTAG Account</h2>
        <p class="form-description">Get started with a free account and protect your vehicle.</p>
      </div>

      <form (ngSubmit)="submitRegister()" #registerForm="ngForm" class="auth-form">
        
        <!-- Email Field -->
        <div class="form-row animate-fade-in-up delay-150">
          <div class="form-group flex-1">
            <label class="form-label">Email Address <span class="required">*</span></label>
            <div class="input-wrapper-inner">
              <span class="input-icon-left"><i class="fa-solid fa-envelope"></i></span>
              <input 
                type="email" 
                name="email" 
                [ngModel]="email()" 
                (ngModelChange)="email.set($event)"
                class="form-input form-input-with-icon" 
                placeholder="john.doe@example.com" 
                required
              />
            </div>
          </div>
        </div>

        <!-- 9. Password Input -->
        <div class="form-group animate-fade-in-up delay-250">
          <label class="form-label">Password <span class="required">*</span></label>
          <div class="input-wrapper-inner">
            <span class="input-icon-left"><i class="fa-solid fa-lock"></i></span>
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              name="password" 
              [ngModel]="password()" 
              (ngModelChange)="password.set($event)"
              class="form-input form-input-with-icon" 
              placeholder="Min. 8 characters" 
              required
            />
            <button 
              type="button" 
              class="btn-toggle-password" 
              (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility"
            >
              <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group animate-fade-in-up delay-250">
          <label class="form-label">Confirm Password <span class="required">*</span></label>
          <div class="input-wrapper-inner">
            <span class="input-icon-left"><i class="fa-solid fa-lock"></i></span>
            <input 
              [type]="showConfirmPassword() ? 'text' : 'password'" 
              name="confirmPassword" 
              [ngModel]="confirmPassword()" 
              (ngModelChange)="confirmPassword.set($event)"
              class="form-input form-input-with-icon" 
              placeholder="Confirm your password" 
              required
            />
            <button 
              type="button" 
              class="btn-toggle-password" 
              (click)="toggleConfirmPasswordVisibility()"
              aria-label="Toggle confirm password visibility"
            >
              <i class="fa-solid" [class.fa-eye]="!showConfirmPassword()" [class.fa-eye-slash]="showConfirmPassword()"></i>
            </button>
          </div>
        </div>





        <!-- 12. Age Verification & Consents -->
        <div class="form-checkbox-group animate-fade-in-up delay-350" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- 18+ Checkbox -->
          <label class="checkbox-container">
            <input 
              type="checkbox" 
              name="is18Plus" 
              [ngModel]="is18Plus()" 
              (ngModelChange)="is18Plus.set($event)"
              required
            />
            <span class="checkmark"></span>
            <span class="checkbox-label">
              I confirm that I am 18 years or older <span class="required">*</span>
            </span>
          </label>
          
          <!-- Terms Checkbox -->
          <label class="checkbox-container">
            <input 
              type="checkbox" 
              name="agreeTerms" 
              [ngModel]="agreeTerms()" 
              (ngModelChange)="agreeTerms.set($event)"
              required
            />
            <span class="checkmark"></span>
            <span class="checkbox-label">
              I agree to the <a href="/terms" target="_blank" class="inline-link">Terms of Service</a> <span class="required">*</span>
            </span>
          </label>

          <!-- Privacy Policy Checkbox -->
          <label class="checkbox-container">
            <input 
              type="checkbox" 
              name="privacyAccepted" 
              [ngModel]="privacyAccepted()" 
              (ngModelChange)="privacyAccepted.set($event)"
              required
            />
            <span class="checkmark"></span>
            <span class="checkbox-label">
              I agree to the <a href="/privacy" target="_blank" class="inline-link">Privacy Policy</a> <span class="required">*</span>
            </span>
          </label>


        </div>

        <!-- Error Alert -->
        @if (errorMessage()) {
          <div class="error-alert animate-fade-in">
            <span><i class="fa-solid fa-triangle-exclamation"></i></span>
            <p>{{ errorMessage() }}</p>
          </div>
        }

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary btn-submit animate-fade-in-up delay-400" 
          [disabled]="isSubmitting()"
        >
          @if (isSubmitting()) {
            <span class="spinner"></span> Creating Account...
          } @else {
            Create Account & Get Started
          }
        </button>

      </form>

      <div class="auth-footer animate-fade-in-up delay-450">
        <p>Already have an account? <a [routerLink]="['/login']" class="auth-switch-link">Sign in here</a></p>
      </div>
    </div>
  </main>

  <footer class="auth-footer-note">
    <p>&copy; 2026 TRAFFTAG. Secure Access Console.</p>
  </footer>
</div>
